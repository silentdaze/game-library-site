<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Library</title>
<meta name="description" content="A searchable catalogue of every game I own, across every platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css?v=641d501e5b">
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <a class="wordmark" href="#/">Game Library<span id="wm-sub">loading…</span></a>
    <div class="head-right">
      <div class="counts">
        <span class="cpill"><b id="c-logged">—</b><span>Logged</span></span>
        <span class="cpill"><b id="c-owned">—</b><span>Owned</span></span>
        <span class="cpill m"><b id="c-beaten">—</b><span>Beaten</span></span>
      </div>
      <button class="statsbtn" id="statsbtn" aria-expanded="false" title="Library stats and health" aria-label="Library stats and health">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      </button>
    </div>
  </header>

  <div id="browse">
    <div class="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search titles, developers, series, or inside collections">
      <button class="clear" id="q-clear" hidden aria-label="Clear search">&times;</button>
    </div>

    <nav class="navtabs">
      <a href="#/" id="tab-library" class="on">Library</a>
      <a href="#/played" id="tab-played">Played</a>
    </nav>

    <div class="filters" id="filters"></div>

    <div class="resultbar">
      <span class="n" id="resultcount">…</span>
      <span class="bar-right">
        <span class="sortwrap">
          <button class="sortbtn" id="sortbtn" aria-expanded="false" aria-haspopup="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M7 4v16M7 20l-3-3M7 4l3 3M17 20V4M17 4l3 3M17 20l-3-3"></path>
            </svg>
            <span id="sortlabel">A–Z</span>
          </button>
          <div class="sortmenu" id="sortmenu" hidden></div>
        </span>
        <span class="viewtoggle">
          <button class="on" id="v-list">List</button>
          <button id="v-grid" disabled title="Available once cover art is added">Grid — coming soon</button>
        </span>
      </span>
    </div>
  </div>

  <div id="stats" hidden></div>
  <main id="view"><p class="loading">Loading the library…</p></main>
  <div class="sentinel" id="sentinel"></div>

</div>
<script src="app.js?v=641d501e5b"></script>
</body>
</html>
