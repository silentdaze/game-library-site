<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Library</title>
<meta name="description" content="A searchable catalogue of every game I own, across every platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css?v=8780b01932">
<!-- Picks light or dark BEFORE the page first paints, so a dark-mode visitor
     never sees a white flash. The saved choice wins; with none, the device
     setting decides. app.js owns the button that changes it. -->
<script>(function(){var t=null;try{t=localStorage.getItem('gl.theme')}catch(e){}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
</head>
<body>
<!-- The blurred band behind the top of a game page. Outside .wrap so it can
     span the window; shown and sized by renderDetail() in app.js. -->
<div class="herobg" id="herobg" hidden><div class="herobg-img" id="herobg-img"></div></div>
<div class="wrap">

  <header class="masthead">
    <a class="wordmark" href="#/">Game Library<span id="wm-sub">loading…</span></a>
    <div class="head-right">
      <div class="counts">
        <span class="cpill"><b id="c-logged">—</b><span>Logged</span></span>
        <span class="cpill"><b id="c-owned">—</b><span>Owned</span></span>
        <span class="cpill m"><b id="c-beaten">—</b><span>Beaten</span></span>
      </div>
      <button class="statsbtn" id="statsbtn" aria-expanded="false" title="Library stats and health" aria-label="Library stats and health">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      </button>
      <button class="statsbtn" id="themebtn" type="button" title="Switch colour theme" aria-label="Switch colour theme"></button>
    </div>
  </header>

  <!-- The toolbar sits OUTSIDE #browse on purpose: a sticky element only
       sticks while its parent is on screen, and #browse ends where the list
       begins. As a child of .wrap it stays pinned the whole way down. It is
       hidden with #browse by a :has() rule in styles.css. The marker above it
       is how app.js knows the toolbar has stuck. -->
  <div class="stuck-mark" id="stuck-mark"></div>
  <div class="toolbar" id="toolbar">
    <div class="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search titles, developers, series, or inside collections">
      <button class="clear" id="q-clear" hidden aria-label="Clear search">&times;</button>
    </div>
    <button class="filtbtn" id="filtbtn" type="button" aria-expanded="false" aria-controls="filters">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
      <span class="ft">Filters</span>
      <span class="cnt" id="filtcnt" hidden></span>
    </button>
  </div>

  <div id="browse">
    <div class="filters" id="filters" hidden></div>

    <!-- Home-page shelves. Filled by renderShelves() in app.js, and only on
         the untouched Library view - any search, filter or sort hides them. -->
    <div id="shelves" hidden></div>
    <!-- Heading for the full list. Shown only with the shelves above it. -->
    <h2 class="allhead" id="allhead" hidden>All games</h2>

    <div class="resultbar">
      <span class="rleft">
        <nav class="navtabs" aria-label="Library or played">
          <a href="#/" id="tab-library" class="on">Library</a>
          <a href="#/played" id="tab-played">Played</a>
        </nav>
        <span class="n" id="resultcount">…</span>
      </span>
      <span class="bar-right">
        <span class="hidewrap">
          <button class="dtrigger" id="hidebtn" type="button" aria-expanded="false" aria-haspopup="true">
            <span id="hidelabel">Hidden (0)</span>
            <span class="arrow">▾</span>
          </button>
          <div class="dpanel" id="hidemenu" hidden>
            <div class="dphead">
              <h6>Hidden</h6>
              <button class="tglbtn" id="hidetoggle" type="button" role="switch" aria-checked="true">
                <span class="tgl"><i></i></span>
              </button>
            </div>
            <div class="doptions" id="hidelist"></div>
          </div>
        </span>
        <span class="sortwrap">
          <button class="sortbtn" id="sortbtn" aria-expanded="false" aria-haspopup="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M7 4v16M7 20l-3-3M7 4l3 3M17 20V4M17 4l3 3M17 20l-3-3"></path>
            </svg>
            <span id="sortlabel">A–Z</span>
          </button>
          <div class="sortmenu" id="sortmenu" hidden></div>
        </span>
        <span class="viewtoggle">
          <button class="on" id="v-list">List</button>
          <button id="v-grid">Grid</button>
        </span>
      </span>
    </div>
  </div>

  <div id="stats" hidden></div>
  <main id="view"><p class="loading">Loading the library…</p></main>
  <div class="sentinel" id="sentinel"></div>

</div>
<button class="totop" id="totop" type="button" aria-label="Back to top">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>
</button>
<script src="app.js?v=8780b01932"></script>
</body>
</html>
